version: 1
program: od
flags:
  - names: [ -A, --address-radix ]
    feature: opt.address-radix
    description: output format for file offsets; RADIX is one of [doxn], for Decimal, Octal, Hex or None
    arity: 1
    values:
      - name: RADIX
        type: string
  - names: [ --endian ]
    feature: opt.endian
    description: swap input bytes according the specified order
    arity: 1
    values:
      - name: "{big|little}"
        type: string
  - names: [ -j, --skip-bytes ]
    feature: opt.skip-bytes
    description: skip BYTES input bytes first
    arity: 1
    values:
      - name: BYTES
        type: size
  - names: [ -N, --read-bytes ]
    feature: opt.read-bytes
    description: limit dump to BYTES input bytes
    arity: 1
    values:
      - name: BYTES
        type: size
  - names: [ -S, --strings ]
    feature: opt.strings
    description: show only NUL terminated strings of at least BYTES (default 3) printable characters
    arity: 1
    values:
      - name: BYTES
        type: size
  - names: [ -t, --format ]
    feature: opt.format
    description: select output format or formats
    arity: 1
    values:
      - name: TYPE
        type: string
  - names: [ -v, --output-duplicates ]
    feature: opt.output-duplicates
    description: do not use * to mark line suppression
    arity: 0
  - names: [ -w, --width ]
    feature: opt.width
    description: output BYTES bytes per output line; 32 is implied when BYTES is not specified
    arity: 1
    values:
      - name: BYTES
        type: size
        optional: true
  - names: [ --traditional ]
    feature: opt.traditional
    description: accept arguments in third form above
    arity: 0
  - names: [ --help ]
    feature: opt.help
    description: display this help and exit
    arity: 0
    self_description: true
  - names: [ --version ]
    feature: opt.version
    description: output version information and exit
    arity: 0
    self_description: true
  - names: [ -a ]
    feature: opt.a
    description: same as -t a,  select named characters, ignoring high-order bit
    arity: 0
  - names: [ -b ]
    feature: opt.b
    description: same as -t o1, select octal bytes
    arity: 0
  - names: [ -c ]
    feature: opt.c
    description: same as -t c,  select printable characters or backslash escapes
    arity: 0
  - names: [ -d ]
    feature: opt.d
    description: same as -t u2, select unsigned decimal 2-byte units
    arity: 0
  - names: [ -f ]
    feature: opt.f
    description: same as -t fF, select floats
    arity: 0
  - names: [ -i ]
    feature: opt.i
    description: same as -t dI, select decimal ints
    arity: 0
  - names: [ -l ]
    feature: opt.l
    description: same as -t dL, select decimal longs
    arity: 0
  - names: [ -o ]
    feature: opt.o
    description: same as -t o2, select octal 2-byte units
    arity: 0
  - names: [ -s ]
    feature: opt.s
    description: same as -t d2, select decimal 2-byte units
    arity: 0
  - names: [ -x ]
    feature: opt.x
    description: same as -t x2, select hexadecimal 2-byte units
    arity: 0
forms:
  - usage: od [OPTION]... [FILE]...
    args:
      - name: FILE
        type: path
        arity: "*"
  - usage: od [-abcdfilosx]... [FILE] [[+]OFFSET[.][b]]
    args:
      - name: FILE
        type: path
        arity: "?"
      - name: +
        type: string
        arity: "?"
      - name: OFFSET[.][b]
        type: string
        arity: "?"
  - usage: od --traditional [OPTION]... [FILE] [[+]OFFSET[.][b] [+][LABEL][.][b]]
    flags: [ --traditional ]
    args:
      - name: FILE
        type: path
        arity: "?"
      - name: +
        type: string
        arity: "?"
      - name: OFFSET[.][b]
        type: string
        arity: "?"
      - name: +
        type: string
        arity: "?"
      - name: LABEL
        type: string
        arity: "?"
      - name: .
        type: string
        arity: "?"
      - name: b
        type: string
        arity: "?"
