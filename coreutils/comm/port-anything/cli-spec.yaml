version: 1
program: comm
flags:
  - names: [ "-1" ]
    feature: opt.1
    description: suppress column 1 (lines unique to FILE1)
    arity: 0
  - names: [ "-2" ]
    feature: opt.2
    description: suppress column 2 (lines unique to FILE2)
    arity: 0
  - names: [ "-3" ]
    feature: opt.3
    description: suppress column 3 (lines that appear in both files)
    arity: 0
  - names: [ --check-order ]
    feature: opt.check-order
    description: check that the input is correctly sorted, even if all input lines are pairable
    arity: 0
  - names: [ --nocheck-order ]
    feature: opt.nocheck-order
    description: do not check that the input is correctly sorted
    arity: 0
  - names: [ --output-delimiter ]
    feature: opt.output-delimiter
    description: separate columns with STR
    arity: 1
    values:
      - name: STR
        type: string
  - names: [ --total ]
    feature: opt.total
    description: output a summary
    arity: 0
  - names: [ -z, --zero-terminated ]
    feature: opt.zero-terminated
    description: line delimiter is NUL, not newline
    arity: 0
  - names: [ --help ]
    feature: opt.help
    description: display this help and exit
    arity: 0
    self_description: true
  - names: [ --version ]
    feature: opt.version
    description: output version information and exit
    arity: 0
    self_description: true
forms:
  - usage: comm [OPTION]... FILE1 FILE2
    args:
      - name: FILE1
        type: path
        arity: "1"
      - name: FILE2
        type: path
        arity: "1"
